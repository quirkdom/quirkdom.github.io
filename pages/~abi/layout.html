<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{title}}</title>
        {{descriptionMeta}}
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
        <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: light)"
            content="#fffff8"
        />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: dark)"
            content="#151515"
        />
        <meta property="og:site_name" content="Quirkdom" />
        <meta property="og:title" content="{{title}}" />
        <meta property="og:image" content="https://quirkdom.com/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@quirkdom" />
        <meta name="twitter:creator" content="@quirkdominion" />
        <meta name="twitter:title" content="{{title}}" />
        <meta name="twitter:image" content="https://quirkdom.com/og-image.png" />
        <link rel="stylesheet" href="/formose.css" />
        <link
            rel="preload"
            href="/fonts/ETbb-Regular-core.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
    </head>
    <body>
        <!-- article/section are what carry tufte's 55% measure: the width rules
             are written as `section > p`, so content placed directly in <main>
             would run the full width of the body. -->
        <article>
            <section>
                <p><a href="/">Quirkdom</a> / ~abi</p>
                <h1>{{title}}</h1>
                {{dateline}}
                {{content}}
            </section>
        </article>
    </body>
</html>
