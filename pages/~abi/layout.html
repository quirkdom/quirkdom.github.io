<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{title}}</title>
        {{descriptionMeta}}
        <link rel="stylesheet" href="/formose.css" />
        <link
            rel="preload"
            href="/fonts/ETbb-Regular-core.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
    </head>
    <body>
        <!-- article/section are what carry tufte's 55% measure: the width rules
             are written as `section > p`, so content placed directly in <main>
             would run the full width of the body. -->
        <article>
            <section>
                <p><a href="/">Quirkdom</a> / ~abi</p>
                <h1>{{title}}</h1>
                {{dateline}}
                {{content}}
            </section>
        </article>
    </body>
</html>
